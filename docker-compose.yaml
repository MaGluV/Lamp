
services:
  lamp:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${PROD_PORT}:80"
    depends_on:
      - db
      - celerybackend
    logging:
      options:
        max-file: "2"
        max-size: "20m"
    volumes:
      - .:/Lamp

  worker:
    build:
      context: .
      dockerfile: DockerfileCelery
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      DEFAULT_ACCESS_TOKEN: ${DEFAULT_ACCESS_TOKEN}
      C_FORCE_ROOT: "true"
    depends_on:
      - db
      - celerybackend
    volumes:
      - .:/worker
      - ./lamp/modules:/worker/lamp/celery/modules
      - ./lamp/utils:/worker/lamp/celery/utils

  flower:
    image: mher/flower
    command: ["celery", "--broker=${CELERY_BROKER_URL}", "flower", "--port=5555"]
    ports:
      - "5555:5555"
    depends_on:
      - celerybackend

  celerybackend:
    image: redis:latest
    ports:
      - 6379:6379
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 30s
      retries: 50
    restart: always

  db:
    image: postgres:${POSTGRES_VERSION}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - ./init_db/init.sql:/docker-entrypoint-initdb.d/create_tables.sql
      - ./lamp_data:/var/lib/postgresql/data
    command: "-c logging_collector=on"
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging:
      options:
        max-file: "5"
        max-size: "20m"
    # deploy:
    #  resources:
    #    limits:
    #      cpus: '1'
    #      memory: 4G

volumes:
  init_db:
    driver: local
  lamp_data:
    driver: local
